[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealthsignals"
version = "0.1.0"
description = "Automated faceless YouTube Shorts pipeline for the WealthSignals channel"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "boto3>=1.34",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "tenacity>=8.5",
]

[tool.setuptools.packages.find]
where = ["src"]
